<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A18"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#101B3B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing energy aura -->
  <circle cx="950" cy="315" r="220" fill="#2563EB" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1020" cy="260" r="140" fill="#38BDF8" opacity="0.22" filter="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="72" height="72" rx="18" fill="#101B3B" stroke="#38BDF8" stroke-width="2"/>
    <path d="M41 12L19 39h16l-4 21 22-26h-16l4-22z" fill="url(#accentGrad)"/>
  </g>
  <text x="190" y="158" font-family="'Prompt', sans-serif" font-weight="700" font-size="34" fill="#FFFFFF" letter-spacing="1">EduEase Energy OS</text>
  <rect x="520" y="132" width="130" height="30" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="585" y="152" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38BDF8" text-anchor="middle" font-weight="600">v2.4 TELEMETRY</text>

  <!-- Main Headline in Thai -->
  <text x="100" y="270" font-family="'Prompt', sans-serif" font-weight="800" font-size="52" fill="#FFFFFF">ระบบจัดการพลังงาน</text>
  <text x="100" y="335" font-family="'Prompt', sans-serif" font-weight="800" font-size="52" fill="url(#accentGrad)">และคำนวณค่าไฟอัจฉริยะ</text>

  <!-- Subtitle -->
  <text x="100" y="405" font-family="'Prompt', sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    จำลองบิลค่าไฟ MEA/PEA · TOU Analytics · Daily Energy Digest · Voltie AI Coach
  </text>

  <!-- Key metrics preview badges -->
  <g transform="translate(100, 465)">
    <rect width="210" height="75" rx="14" fill="#0E1838" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="24" y="32" font-family="'Prompt', sans-serif" font-size="14" fill="#94A3B8">อัตราค่าไฟแม่นยำ</text>
    <text x="24" y="58" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#38BDF8">TOU &amp; อัตราก้าวหน้า</text>
  </g>

  <g transform="translate(330, 465)">
    <rect width="210" height="75" rx="14" fill="#0E1838" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="24" y="32" font-family="'Prompt', sans-serif" font-size="14" fill="#94A3B8">ประหยัดเฉลี่ย</text>
    <text x="24" y="58" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#10B981">15% - 25% / เดือน</text>
  </g>

  <g transform="translate(560, 465)">
    <rect width="210" height="75" rx="14" fill="#0E1838" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="24" y="32" font-family="'Prompt', sans-serif" font-size="14" fill="#94A3B8">แจ้งเตือนทุกเช้า</text>
    <text x="24" y="58" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#F59E0B">Daily Digest</text>
  </g>

  <!-- Large Right Graphic Illustration: Isometric Smart Meter Gauge -->
  <g transform="translate(850, 200)">
    <circle cx="150" cy="150" r="140" fill="#0B132B" stroke="#2563EB" stroke-width="4" opacity="0.9"/>
    <circle cx="150" cy="150" r="115" fill="none" stroke="#38BDF8" stroke-width="6" stroke-dasharray="450 150"/>
    <circle cx="150" cy="150" r="85" fill="#060A18" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2"/>
    <text x="150" y="142" font-family="'Inter', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">248.5</text>
    <text x="150" y="172" font-family="'JetBrains Mono', monospace" font-size="14" fill="#10B981" text-anchor="middle">kWh / MONTH</text>
  </g>
</svg>
