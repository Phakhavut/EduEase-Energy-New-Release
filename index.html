            width: 100%; 
            transition: all 0.2s ease !important;
            font-weight: 500;
        }
        
        .nav-link:hover {
            background: rgba(30, 193, 203, 0.08) !important;
            color: var(--primary) !important;
        }

        .nav-link.active { 
            background: rgba(30, 193, 203, 0.15) !important; 
            color: var(--primary) !important; 
            box-shadow: 0 8px 20px rgba(30, 193, 203, 0.12);
            font-weight: 600 !important;
        }

        .nav-link i { margin-right: 12px; width: 20px; text-align: center; }

        .main-content-dashboard { 
            margin-left: 0; 
            padding: clamp(16px, 4vw, 24px) clamp(12px, 3vw, 24px); 
            transition: margin 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s;
            width: 100%;
        }

        @media (min-width: 1024px) {
            .main-content-dashboard {
                margin-left: 280px;
                width: calc(100% - 280px);
                padding: clamp(24px, 4vw, 40px);
            }
        }
        
        .dashboard-card { 
            background: var(--card-bg); 
            border-radius: 32px; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); 
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        
        @keyframes theme-blur-in-dark {
            0% {
                filter: blur(8px);
                opacity: 0.85;
            }
            100% {
                filter: blur(0px);
                opacity: 1;
            }
        }

        @keyframes theme-blur-in-light {
            0% {
                filter: blur(8px);
                opacity: 0.85;
            }
            100% {
                filter: blur(0px);
                opacity: 1;
            }
        }

        [data-theme="dark"] .dashboard-card {
            animation: theme-blur-in-dark 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        [data-theme="light"] .dashboard-card {
            animation: theme-blur-in-light 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .dashboard-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.06);
        }
        
        .calculator-node {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .calculator-node::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            opacity: 0.2;
        }

        .calculator-node:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(30, 193, 203, 0.15);
        }

        .hologram-card {
            background: linear-gradient(135deg, #1EC1CB 0%, #169EA7 60%, #1C1C28 100%);
            color: white;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(30, 193, 203, 0.3);
        }

        .tech-grid {
            background-image: 
                linear-gradient(rgba(30, 193, 203, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 193, 203, 0.04) 1px, transparent 1px);
            background-size: 25px 25px;
        }

        .neon-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .label { color: var(--text-gray); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; }
        
        .neural-pulse {
            width: 10px; height: 10px; background: var(--success); border-radius: 50%;
            display: inline-block; animation: pulse-cyan 2s infinite;
        }

        @keyframes pulse-cyan {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 193, 203, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(30, 193, 203, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(30, 193, 203, 0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideLeft {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .animate-slide-left { animation: slideLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-spin-slow { animation: spin 10s linear infinite; }
        .bg-transition {
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Overlay for mobile sidebar */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
        }
        .sidebar-overlay.show {
            display: block;
        }
        @media (min-width: 1024px) {
            .sidebar-overlay {
                display: none !important;
            }
        }

        /* Custom Range Slider for Hologram Card */
        .custom-range-slider {
            height: 6px;
            background: rgba(255,255,255,0.2) !important;
            border-radius: 10px;
        }
        .custom-range-slider::-webkit-slider-thumb {
            background: #fff !important;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
        }
        /* Print Styles */
        @media print {
            .sidebar, header, .sidebar-overlay, .no-print {
                display: none !important;
            }
            .main-content-dashboard {
                margin-left: 0 !important;
                padding: 0 !important;
            }
            .dashboard-card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                page-break-inside: avoid;
            }
            body {
                background: white !important;
                color: black !important;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
